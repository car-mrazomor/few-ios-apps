name: iFuckAI
options:
  bundleIdPrefix: io.ubiship
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  iFuckAI:
    type: application
    platform: iOS
    sources:
      - path: iFuckAI
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: true
    info:
      path: iFuckAI/Info.plist
      properties:
        CFBundleDisplayName: iFuck AI
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: iFuck AI uses the camera so you can ask a vision model about what you photograph. Photos stay on your device.
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.ubiship.PocketLM
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        SUPPORTED_PLATFORMS: iphoneos
