name: PocketCode
options:
  bundleIdPrefix: io.ubiship
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Runestone:
    url: https://github.com/simonbs/Runestone.git
    exactVersion: 0.5.2
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages.git
    exactVersion: 0.1.10
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0

targets:
  PocketCode:
    type: application
    platform: iOS
    sources:
      - path: PocketCode
        excludes:
          - Python/**
          - Notebook/web/**
    dependencies:
      # Run scripts/fetch-deps.sh first to download Vendor/.
      - framework: Vendor/Python.xcframework
        embed: true
        codeSign: true
      - package: Runestone
      - package: SwiftTerm
      - package: TreeSitterLanguages
        products:
          - TreeSitterPythonRunestone
          - TreeSitterJSONRunestone
          - TreeSitterMarkdownRunestone
          - TreeSitterBashRunestone
          - TreeSitterYAMLRunestone
          - TreeSitterJavaScriptRunestone
          - TreeSitterHTMLRunestone
          - TreeSitterCSSRunestone
          - TreeSitterTOMLRunestone
    postBuildScripts:
      - name: Install Python
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Unsigned builds (for AltStore) have no identity; sign the stdlib modules ad hoc, AltStore re-signs them.
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          source "$PROJECT_DIR/Vendor/Python.xcframework/build/utils.sh"
          install_python Vendor/Python.xcframework
          rsync -a --delete "$PROJECT_DIR/Vendor/app_packages/" "$CODESIGNING_FOLDER_PATH/app_packages/"
          rsync -a --delete --exclude "__pycache__" "$PROJECT_DIR/PocketCode/Python/" "$CODESIGNING_FOLDER_PATH/app/"
          rsync -a --delete "$PROJECT_DIR/Vendor/pyodide/" "$CODESIGNING_FOLDER_PATH/pyodide/"
          rsync -a --delete "$PROJECT_DIR/PocketCode/Notebook/web/" "$CODESIGNING_FOLDER_PATH/notebook/"
          rsync -a "$PROJECT_DIR/Vendor/notebook-lib/" "$CODESIGNING_FOLDER_PATH/notebook/lib/"
    info:
      path: PocketCode/Info.plist
      properties:
        CFBundleDisplayName: PocketCode
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Projects live in Documents and show up in the Files app under "On My iPhone".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: PocketCode/Engine/PocketCode-Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # BeeWare's install script handles one architecture per build; Apple-silicon simulators are arm64.
        ARCHS[sdk=iphonesimulator*]: arm64
