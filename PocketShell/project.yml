name: PocketShell
options:
  bundleIdPrefix: io.ubiship
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Pinned to 0.12.0: 0.12.1 swapped swift-nio-ssh to an unvetted third-party fork.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.0
  swift-nio-ssh:
    url: https://github.com/Joannis/swift-nio-ssh.git
    exactVersion: 0.3.5
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
  # Code tabs (merged from PocketCode)
  Runestone:
    url: https://github.com/simonbs/Runestone.git
    exactVersion: 0.5.2
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages.git
    exactVersion: 0.1.10

targets:
  PocketShell:
    type: application
    platform: iOS
    sources:
      - path: PocketShell
        excludes:
          - Code/Python/**
          - Code/Notebook/web/**
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-crypto
        product: _CryptoExtras
      # Code tabs. Run scripts/fetch-deps.sh first to download Vendor/.
      - framework: Vendor/Python.xcframework
        embed: true
        codeSign: true
      - package: Runestone
      - package: TreeSitterLanguages
        products:
          - TreeSitterPythonRunestone
          - TreeSitterJSONRunestone
          - TreeSitterMarkdownRunestone
          - TreeSitterBashRunestone
          - TreeSitterYAMLRunestone
          - TreeSitterJavaScriptRunestone
          - TreeSitterHTMLRunestone
          - TreeSitterCSSRunestone
          - TreeSitterTOMLRunestone
    postBuildScripts:
      - name: Install Python
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Unsigned builds (for AltStore) have no identity; sign the stdlib modules ad hoc, AltStore re-signs them.
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          source "$PROJECT_DIR/Vendor/Python.xcframework/build/utils.sh"
          install_python Vendor/Python.xcframework
          rsync -a --delete "$PROJECT_DIR/Vendor/app_packages/" "$CODESIGNING_FOLDER_PATH/app_packages/"
          rsync -a --delete --exclude "__pycache__" "$PROJECT_DIR/PocketShell/Code/Python/" "$CODESIGNING_FOLDER_PATH/app/"
          rsync -a --delete "$PROJECT_DIR/Vendor/pyodide/" "$CODESIGNING_FOLDER_PATH/pyodide/"
          rsync -a --delete "$PROJECT_DIR/PocketShell/Code/Notebook/web/" "$CODESIGNING_FOLDER_PATH/notebook/"
          rsync -a "$PROJECT_DIR/Vendor/notebook-lib/" "$CODESIGNING_FOLDER_PATH/notebook/lib/"
    info:
      path: PocketShell/Info.plist
      properties:
        CFBundleDisplayName: PocketShell
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: SSH Key
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.text]
        # Code projects live in Documents and show up in the Files app under "On My iPhone".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: PocketShell connects to SSH servers on your local network.
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: PocketShell/Code/Engine/PocketCode-Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # BeeWare's install script handles one architecture per build; Apple-silicon simulators are arm64.
        ARCHS[sdk=iphonesimulator*]: arm64
