name: MinnetCam
options:
  bundleIdPrefix: io.ubiship
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MinnetCam:
    type: application
    platform: iOS
    sources:
      - path: MinnetCam
    dependencies:
      - sdk: Accelerate.framework
    info:
      path: MinnetCam/Info.plist
      properties:
        CFBundleDisplayName: minnet
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: minnet uses the camera to recognize what you point it at. Frames are processed on your phone and never leave it.
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: MinnetCam/Engine/Bridging-Header.h
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) MN_ACCELERATE=1 ACCELERATE_NEW_LAPACK=1"
        GCC_C_LANGUAGE_STANDARD: gnu11
        ARCHS[sdk=iphonesimulator*]: arm64
